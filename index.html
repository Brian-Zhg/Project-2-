<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Safe</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <div id="container">
        <div id="map"></div>
        <div id="searchBox">
            <div class="search-field">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
                <input id="search" type="search" placeholder="Search restaurants…" autocomplete="off"
                    aria-label="Search restaurants by name">
                <button id="clearSearch" type="button" aria-label="Clear search" hidden>×</button>
            </div>
            <p id="searchStatus" hidden></p>
        </div>
        <div>
        <button id="stats">See Stats</button>
        <div id="legend"> 
            <strong>Grade</strong>
            <span class="legend-hint">Click to show / hide</span>
            <button class="legend-item" data-color="green" aria-pressed="true">
                <span class="dot a"></span>A<span class="count" id="count-green"></span>
            </button>
            <button class="legend-item" data-color="yellow" aria-pressed="true">
                <span class="dot b"></span>B<span class="count" id="count-yellow"></span>
            </button>
            <button class="legend-item" data-color="red" aria-pressed="true">
                <span class="dot c"></span>C<span class="count" id="count-red"></span>
            </button>
            <button class="legend-item" data-color="grey" aria-pressed="true">
                <span class="dot p"></span>Pending / other<span class="count" id="count-grey"></span>
            </button>
        </div>
        </div>
        <div id="info">
            <p id="closeInfo">x</p>
            <h4 id="rName"></h4>
            <div id="history">
                <div class="statHolder">
                    <div class="timeHolder">
                        <a>First Inspection</a>
                        <p id="startTime"></p>
                    </div>
                    <div class="timeHolder">
                        <a>Latest Inspection</a>
                        <p id="endTime"></p>
                    </div>
                </div>
                <p id="totalLength"></p>
            </div>
            <div id="violations"></div>
            <div class="statHolder">
                <p id="totalViolations"></p>
                <p id="totalCriticalViolations"></p>
            </div>
            <div id="switchBox">
                <p>Latest Inspection</p>
                <label class="switch">
                    <input id="amount" type="checkbox">
                    <span class="slider round"></span>
                </label>
                <p>All inspections</p>
            </div>
        </div>
    </div>
    <div id="chartLayout">
    <div class="multipleSelection">
        <div class="selectBox" onclick="showCheckboxes()">
            <div>Select Cuisines </div>
        </div>

        <div id="checkBoxes"></div>
    </div>

    <div id="chartContainer">
        <canvas id="myChart"></canvas>
    </div>
</div>
    <div id="legend">
        <p><span class="dot a"></span>A</p>
        <p><span class="dot b"></span>B</p>
        <p><span class="dot c"></span>C</p>
        <p><span class="dot p"></span>Pending</p>
    </div>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
</body>

</html>
